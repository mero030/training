<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Progress Ladder">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Progress Ladder</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0d;--surface:#141414;--card:#1a1a1a;--border:#242424;
  --text:#efefef;--soft:#888;--muted:#444;
  --lime:#d4f53c;--amber:#f5a623;--sky:#6ec6f5;
  --green:#6fcf97;--lav:#b69ef5;--rose:#f56e6e;
  --blue:#4a9eff;
  --acc:#6fcf97;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden;overscroll-behavior:none;}
input,button,textarea{font-family:inherit;}
input,textarea{background:#0a0a0a;border:1px solid #252525;color:var(--text);padding:8px 9px;font-size:12.6px;width:100%;outline:none;border-radius:2px;transition:border-color 0.15s;-webkit-appearance:none;}
input:focus,textarea:focus{border-color:var(--acc);}
input::placeholder,textarea::placeholder{color:#333;}
button{cursor:pointer;}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* HEADER */
#header{background:var(--bg);border-bottom:1px solid var(--border);padding-top:var(--safe-top);flex-shrink:0;position:relative;z-index:50;}
#header-top{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:flex-start;}
#hdr-tag{font-size:8.1px;letter-spacing:3px;color:var(--blue);font-weight:700;margin-bottom:2px;}
#hdr-title{font-size:21.6px;font-weight:900;letter-spacing:1px;line-height:1;}
#hdr-date{font-size:10.8px;color:var(--soft);margin-top:2px;font-style:italic;}
#hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
#save-badge{font-size:8.1px;letter-spacing:2px;font-weight:700;color:var(--green);opacity:0;transition:opacity 0.3s;height:14px;}
#save-badge.show{opacity:1;}
#mode-row{display:flex;gap:1px;}
.mode-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 8px;font-size:8.9px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;transition:all 0.15s;}
.mode-btn.on{background:var(--card);border-color:#444;color:var(--text);}
.mode-btn.edit-on{background:#001a3a;border-color:var(--blue);color:var(--blue);}

/* PROGRESS */
#prog-wrap{padding:8px 16px 10px;}
#prog-row{display:flex;justify-content:space-between;margin-bottom:5px;}
#prog-lbl{font-size:8.1px;letter-spacing:2px;color:var(--muted);}
#prog-ct{font-size:9px;font-weight:700;}
#prog-track{height:2px;background:#1a1a1a;border-radius:2px;overflow:hidden;}
#prog-fill{height:100%;border-radius:2px;transition:width 0.4s ease;}

/* STOPWATCH */
#stopwatch-wrap{padding:8px 16px 10px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);}
#sw-display{font-size:23.4px;font-weight:900;letter-spacing:2px;color:var(--sky);font-variant-numeric:tabular-nums;min-width:86px;}
#sw-btns{display:flex;gap:5px;flex:1;}
.sw-btn{flex:1;padding:7px 4px;font-size:9px;font-weight:700;letter-spacing:1px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;transition:all 0.15s;}
.sw-btn.go{border-color:var(--blue);color:var(--blue);}
.sw-btn.stop{border-color:var(--rose);color:var(--rose);}
.sw-btn.reset{border-color:var(--muted);color:var(--muted);}
.sw-btn.new-session{border-color:var(--green);color:var(--green);background:#0d1a0d;display:none;}
.sw-btn.new-session.show{display:flex;align-items:center;justify-content:center;}

/* DAY TABS */
#day-tabs{display:flex;border-top:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.dtab{flex:1;min-width:56px;padding:9px 2px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:8.1px;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;gap:1px;}
.dtab.on{background:var(--card);}
.dtab-sub{font-size:6.3px;letter-spacing:1px;opacity:0.65;}

/* SCROLL */
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(100px + var(--safe-bot));}

/* TODAY */
#today-view{padding:0 14px;}
#variant-tabs{display:flex;gap:1px;margin:10px 0 4px;}
.vtab{flex:1;padding:7px;font-size:10.8px;font-weight:700;letter-spacing:2px;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:inherit;transition:all 0.15s;}
.vtab.on{background:var(--card);border-color:#4a9eff;color:#4a9eff;}
.vtab.alt-on{background:#1a0a1a;border-color:#b69ef5;color:#b69ef5;}
.phase-div{font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;font-weight:700;padding:12px 0 5px;border-top:1px solid #1a1a1a;margin-top:2px;}
.phase-div:first-child{border-top:none;padding-top:10px;}
.excard{border:1px solid var(--border);border-left-width:3px;background:var(--card);margin-bottom:2px;transition:background 0.2s,border-color 0.2s;}
.excard.done-all{background:#111a0f;border-color:#1e3320;border-left-color:var(--green)!important;}
.exhdr{padding:10px 11px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.exname{font-size:13.5px;font-weight:700;letter-spacing:0.3px;display:flex;align-items:center;gap:5px;flex:1;min-width:0;}
.exname.dn{color:var(--green);}
.extarget{font-size:9.9px;color:var(--muted);letter-spacing:1px;margin-top:2px;}
.addset-btn{background:transparent;border:1px solid #333;color:var(--soft);padding:7px 10px;font-size:9px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:4px;flex-shrink:0;transition:all 0.15s;border-radius:2px;min-width:52px;justify-content:center;}
.addset-btn:active{opacity:0.6;transform:scale(0.94);}
.sets-wrap{padding:0 11px 10px;}
.sets-hdr{display:grid;grid-template-columns:1fr 1fr 28px;gap:4px;margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid #1e1e1e;}
.sh{font-size:8.1px;color:var(--muted);letter-spacing:1px;}
.set-row{display:grid;grid-template-columns:1fr 1fr 28px;gap:4px;margin-bottom:4px;align-items:center;transition:opacity 0.2s;}
.set-row.faded{opacity:0.5;}
.done-btn{width:24px;height:36px;border:1px solid #333;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:8.1px;font-weight:700;transition:all 0.15s;flex-shrink:0;border-radius:2px;padding:0;}
.done-btn.ck{background:var(--green);border-color:var(--green);color:#0d0d0d;}
.del-btn{background:transparent;border:none;color:#2a2a2a;padding:4px;display:flex;align-items:center;justify-content:center;transition:color 0.15s;width:28px;height:36px;}
.del-btn:active{color:var(--rose);}
.excard.skipped{background:#111215;border-color:#252830;border-left-color:var(--muted)!important;}
.skip-btn{background:transparent;border:1px solid #333;color:var(--muted);padding:7px 10px;font-size:9px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:4px;flex-shrink:0;transition:all 0.15s;border-radius:2px;min-width:52px;justify-content:center;margin-left:4px;}
.skip-btn:active{opacity:0.6;transform:scale(0.94);}
.skip-btn.active{border-color:#555;color:#888;background:#1a1a1a;}
.skipped-hint{font-size:9.9px;color:var(--muted);font-style:italic;padding:0 11px 10px;letter-spacing:1px;}
.empty-hint{font-size:9.9px;color:#2a2a2a;font-style:italic;padding:0 11px 10px;}
#done-banner{display:none;margin:14px 0;padding:16px;background:#0d1f0d;border:1px solid #1e4020;border-left:3px solid var(--green);text-align:center;}
#done-banner.show{display:block;}
#done-banner h2{font-size:19.8px;font-weight:900;color:var(--green);letter-spacing:2px;}
#done-banner p{font-size:9.9px;color:var(--muted);margin-top:4px;font-style:italic;}

/* EDIT */
#edit-view{padding:14px;display:none;}
#edit-view.show{display:block;}
.edit-banner{background:#001a3a;border:1px solid #003a7a;border-left:3px solid var(--amber);padding:10px 14px;margin-bottom:14px;font-size:9.9px;color:#6ec6f5;line-height:1.6;}
.edit-excard{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--amber);margin-bottom:6px;transition:opacity 0.2s;}
.edit-excard-hdr{padding:10px 12px;display:flex;align-items:center;gap:8px;}
.drag-handle{color:var(--muted);font-size:18px;padding:2px 6px;flex-shrink:0;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;}
.edit-exname{flex:1;font-size:11.7px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.edit-extarget{font-size:8.1px;color:var(--muted);margin-top:1px;}
.edit-expand-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 9px;font-size:9px;letter-spacing:1px;}
.edit-exbody{padding:0 12px 12px;display:none;border-top:1px solid var(--border);}
.edit-exbody.open{display:block;}
.edit-field{margin-top:10px;}
.edit-field label{font-size:8.1px;letter-spacing:2px;color:var(--muted);display:block;margin-bottom:4px;}
.edit-actions{display:flex;gap:6px;margin-top:12px;}
.eact-btn{flex:1;padding:9px;font-size:9px;font-weight:700;letter-spacing:1px;border:1px solid transparent;font-family:inherit;cursor:pointer;background:var(--surface);color:var(--soft);}
.eact-del{background:#1a0505;color:var(--rose);border-color:#3a1515;}
.eact-save{background:#0d1a00;color:var(--green);border-color:#1e3a00;}
.add-ex-btn{width:100%;padding:13px;background:transparent;border:1px dashed #333;color:var(--muted);font-size:9.9px;font-weight:700;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;font-family:inherit;}
.day-mgmt{display:flex;gap:6px;margin-bottom:14px;}
.add-day-btn{flex:1;padding:10px;background:transparent;border:1px dashed #4a9eff55;color:var(--blue);font-size:9.9px;font-weight:700;letter-spacing:1px;font-family:inherit;}
.del-day-btn{padding:10px 14px;background:#1a0505;border:1px solid #3a1515;color:var(--rose);font-size:9.9px;font-weight:700;letter-spacing:1px;font-family:inherit;}
.edit-day-hdr{display:flex;gap:8px;margin-bottom:14px;align-items:center;}
.edit-day-lbl{font-size:9px;color:var(--muted);letter-spacing:2px;flex-shrink:0;font-weight:700;}

/* HISTORY */
#hist-view{padding:14px;display:none;}
#hist-view.show{display:block;}
#hist-day-tabs{display:flex;gap:1px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.hdt{flex:1;min-width:48px;padding:8px 2px;font-size:8.1px;font-weight:700;letter-spacing:1px;background:transparent;border:1px solid var(--border);color:var(--muted);transition:all 0.15s;}
.hdt.on{background:var(--card);color:var(--text);border-color:#444;}
.hsession{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--blue);margin-bottom:18px;}
.hshdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:6px;}
.hsdate{font-size:11.7px;font-weight:700;flex:1;}
.hscount{font-size:8.1px;color:var(--muted);letter-spacing:1px;}
.hdel-session{background:transparent;border:none;color:#333;padding:4px 6px;font-size:9.9px;flex-shrink:0;transition:color 0.15s;font-family:inherit;}
.hdel-session:active{color:var(--rose);}
.hex{padding:8px 14px;border-bottom:1px solid #1a1a1a;}
.hex:last-child{border-bottom:none;padding-bottom:10px;}
.hexname{font-size:9.9px;font-weight:700;color:#ccc;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.hdel-ex{background:transparent;border:none;color:#333;font-size:9px;padding:2px 4px;transition:color 0.15s;flex-shrink:0;font-family:inherit;cursor:pointer;}
.hdel-ex:active{color:var(--rose);}
.hsets{display:flex;gap:4px;flex-wrap:wrap;}
.hpill{background:#1a1a1a;border:1px solid #252525;padding:3px 6px 3px 8px;font-size:9px;color:var(--muted);display:flex;gap:3px;align-items:center;}
.hpill.dk{background:#1a2a1a;border-color:#2a4a2a;color:var(--green);}
.hdel-set{background:transparent;border:none;color:#333;font-size:9px;padding:0 0 0 2px;cursor:pointer;transition:color 0.15s;line-height:1;}
.hdel-set:active{color:var(--rose);}
.no-hist{color:var(--muted);font-size:10.8px;font-style:italic;padding:20px 0;}

/* FLOAT PROGRESS PILL */
#float{position:fixed;bottom:calc(16px + var(--safe-bot));left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:10px;font-size:9.9px;letter-spacing:1px;box-shadow:0 4px 28px #000d;pointer-events:none;white-space:nowrap;border-radius:24px;}
#f-dot{width:8px;height:8px;border-radius:50%;}
#f-lbl{color:var(--muted);}
#f-pct{font-weight:700;}
#f-sep{color:#2a2a2a;}
#f-frac{color:var(--muted);}

/* REST TIMER FAB */
#break-fab{
  position:fixed;right:16px;bottom:calc(82px + var(--safe-bot));
  width:58px;height:58px;border-radius:50%;
  background:var(--card);border:2px solid var(--blue);
  color:var(--blue);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
  box-shadow:0 4px 20px #000c;z-index:90;font-family:inherit;
  transition:all 0.2s;
}
#break-fab.running{border-color:var(--rose);color:var(--rose);background:#1a0505;}
#break-fab.done{border-color:var(--green);color:var(--green);background:#0d1a0d;animation:pulse 0.6s ease infinite alternate;}
@keyframes pulse{from{transform:scale(1);}to{transform:scale(1.08);}}
#bfab-time{font-size:11.7px;font-weight:900;letter-spacing:1px;line-height:1;}
#bfab-lbl{font-size:6.3px;letter-spacing:1px;font-weight:700;}

/* REST MODAL */
#break-modal{display:none;position:fixed;inset:0;background:#000b;z-index:200;align-items:flex-end;justify-content:center;}
#break-modal.show{display:flex;}
#break-box{background:var(--card);border:1px solid var(--border);border-top:2px solid var(--blue);padding:24px 20px;width:100%;max-width:400px;padding-bottom:calc(24px + var(--safe-bot));}
#break-box.urgent{border-top-color:var(--rose);}
.bm-title{font-size:8.1px;letter-spacing:3px;color:var(--blue);font-weight:700;margin-bottom:16px;}
#break-time-display{font-size:64.8px;font-weight:900;color:var(--text);text-align:center;letter-spacing:4px;font-variant-numeric:tabular-nums;line-height:1;margin-bottom:6px;}
#break-time-display.urgent{color:var(--rose);}
#break-time-display.done{color:var(--green);}
#bprog-track{height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden;margin-bottom:20px;}
#bprog-fill{height:100%;background:var(--blue);border-radius:2px;transition:width 0.4s linear;}
#bprog-fill.urgent{background:var(--rose);}
.bp-presets{display:flex;gap:5px;margin-bottom:12px;}
.bpreset{flex:1;padding:8px 2px;font-size:9px;font-weight:700;letter-spacing:1px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;}
.bpreset.on{border-color:var(--blue);color:var(--blue);background:#001a3a;}
.bcustom-row{display:flex;gap:10px;align-items:center;margin-bottom:16px;}
.bcustom-row label{font-size:8.1px;letter-spacing:2px;color:var(--muted);white-space:nowrap;}
#bcustom-min{max-width:56px;text-align:center;font-size:14.4px;font-weight:700;}
#bcustom-sec{max-width:56px;text-align:center;font-size:14.4px;font-weight:700;}
.bcustom-sep{font-size:18px;font-weight:700;color:var(--muted);}
.bctrl-btns{display:flex;gap:6px;}
.bctrl{flex:1;padding:13px;font-size:10.8px;font-weight:700;letter-spacing:1px;border:none;font-family:inherit;cursor:pointer;}
#bctrl-start{background:var(--blue);color:#fff;}
#bctrl-start.running{background:var(--rose);color:#fff;}
#bctrl-start.done{background:var(--green);color:#0d0d0d;}
#bctrl-close{background:var(--surface);color:var(--soft);}

/* CONFIRM */
#confirm-modal{display:none;position:fixed;inset:0;background:#000b;z-index:300;align-items:center;justify-content:center;padding:24px;}
#confirm-modal.show{display:flex;}
#confirm-box{background:var(--card);border:1px solid var(--border);border-top:2px solid var(--rose);padding:24px;width:100%;max-width:320px;}
#confirm-box h3{font-size:14.4px;font-weight:900;color:var(--rose);margin-bottom:8px;letter-spacing:1px;}
#confirm-box p{font-size:10.8px;color:var(--soft);margin-bottom:18px;line-height:1.5;}
#confirm-btns{display:flex;gap:6px;}
.conf-btn{flex:1;padding:10px;font-size:9.9px;font-weight:700;letter-spacing:1px;border:none;font-family:inherit;cursor:pointer;}
#conf-ok{background:var(--rose);color:#0d0d0d;}
#conf-cancel{background:var(--surface);color:var(--soft);}

/* INPUT MODAL */
#input-modal{display:none;position:fixed;inset:0;background:#000b;z-index:300;align-items:center;justify-content:center;padding:24px;}
#input-modal.show{display:flex;}
#input-box{background:var(--card);border:1px solid var(--border);border-top:2px solid var(--blue);padding:24px;width:100%;max-width:320px;}
#input-box h3{font-size:14.4px;font-weight:900;color:var(--blue);margin-bottom:8px;letter-spacing:1px;}
#input-box p{font-size:10.8px;color:var(--soft);margin-bottom:12px;line-height:1.5;}
#input-field{margin-bottom:16px;}
#input-btns{display:flex;gap:6px;}
.input-btn{flex:1;padding:10px;font-size:9.9px;font-weight:700;letter-spacing:1px;border:none;font-family:inherit;cursor:pointer;}
#input-ok{background:var(--blue);color:#fff;}
#input-cancel{background:var(--surface);color:var(--soft);}

/* OFFLINE */
#offline-bar{display:none;background:#1a0a00;border-bottom:1px solid #3a1800;padding:6px 16px;font-size:9px;color:var(--blue);letter-spacing:1px;font-weight:700;text-align:center;}
#offline-bar.show{display:block;}
</style>
</head>
<body>
<div id="app">
  <div id="offline-bar">⚡ OFFLINE MODE — data saved locally</div>

  <div id="header">
    <div id="header-top">
      <div>
        <div id="hdr-tag">PROGRESS LADDER</div>
        <div id="hdr-title"><span id="hdr-color" style="color:var(--blue)">UPPER</span></div>
        <div id="hdr-date"></div>
      </div>
      <div id="hdr-right">
        <div id="save-badge">✓ SAVED</div>
        <div id="mode-row">
          <button class="mode-btn on"  onclick="setMode('today')">Today</button>
          <button class="mode-btn"     onclick="setMode('history')">History</button>
          <button class="mode-btn"     onclick="setMode('edit')">Edit</button>
        </div>
      </div>
    </div>
    <div id="prog-wrap">
      <div id="prog-row">
        <span id="prog-lbl">SESSION PROGRESS</span>
        <span id="prog-ct">0/0</span>
      </div>
      <div id="prog-track"><div id="prog-fill" style="width:0"></div></div>
    </div>
    <div id="stopwatch-wrap">
      <div id="sw-display">00:00</div>
      <div id="sw-btns">
        <button class="sw-btn go"          id="sw-toggle"     onclick="swToggle()">START</button>
        <button class="sw-btn reset"       id="sw-reset"      onclick="swReset()">RESET</button>
        <button class="sw-btn new-session" id="sw-newsession" onclick="newSession()">✓ NEW SESSION</button>
      </div>
    </div>
    <div id="day-tabs"></div>
  </div>

  <div id="scroll">
    <div id="today-view">
      <div id="variant-tabs">
        <button class="vtab on" id="vtab-main" onclick="setVariant('main')">MAIN</button>
        <button class="vtab"    id="vtab-alt"  onclick="setVariant('alt')">ALT</button>
      </div>
      <div id="main"></div>
      <div id="done-banner"><h2>SESSION COMPLETE ✓</h2><p>All exercises logged. Rest well.</p></div>
    </div>
    <div id="hist-view">
      <div style="display:flex;gap:6px;margin-bottom:14px;">

// ALT workouts — empty by default, fill via Edit mode
const DEFAULT_ALT={
  upper1:{label:"UPPER 1",sub:"UPPER 1",color:"#4a9eff",exercises:[]},
  upper2:{label:"UPPER 2",sub:"UPPER 2",color:"#4a9eff",exercises:[]},
  upper3:{label:"UPPER 3",sub:"UPPER 3",color:"#4a9eff",exercises:[]},
  lower1:{label:"LOWER 1",sub:"LOWER 1",color:"#4a9eff",exercises:[]},
  lower2:{label:"LOWER 2",sub:"LOWER 2",color:"#4a9eff",exercises:[]},
  lower3:{label:"LOWER 3",sub:"LOWER 3",color:"#4a9eff",exercises:[]},
};

const DEFAULT_DAYS=["upper1","upper2","upper3","lower1","lower2","lower3"];

const SK_DAYS="training_days_v2";
let DAYS=[...DEFAULT_DAYS];

function loadDays(){
  try{
    const s=localStorage.getItem(SK_DAYS);
    if(s){
      const parsed=JSON.parse(s);
      if(Array.isArray(parsed)&&parsed.length>0)DAYS=parsed;
    }
  }catch(e){console.error("Failed to load days from storage:",e);}
}
function saveDays(){localStorage.setItem(SK_DAYS,JSON.stringify(DAYS));}

const SK_ALT="training_program_alt_v2";
const SK_LOGS="training_logs_v2";
const SK_PROG="training_program_v5";
const SK_DAYS_MIGRATED="training_days_migrated_v2";

// One-time migration: if old program keys exist, clear them so new defaults load
(function migrate(){
  if(!localStorage.getItem(SK_DAYS_MIGRATED)){
    localStorage.removeItem("training_program_v4");
    localStorage.removeItem("training_program_alt_v1");
    localStorage.removeItem("training_days_v2");
    localStorage.setItem(SK_DAYS_MIGRATED,"1");
  }
})();

// ── STATE ─────────────────────────────────────────────────────────────
function guessDay(){
  const last=localStorage.getItem("last_day");
  if(last&&DAYS.includes(last))return last;
  return DAYS[0];
}

let day=null;
let histDay=null;
let mode="today",variant="main";
let logs={},P={},ALT={};
let confirmCb=null,expandedEx=null;
let dragSrc=null,dragLastTarget=null,touchDragId=null,touchLastTarget=null;
// Tab reorder drag state
let tabDragSrc=null,tabDragLast=null,tabTouchSrc=null,tabTouchLast=null;

function todayKey(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function yesterdayKey(){
  const d=new Date();d.setDate(d.getDate()-1);
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function sessionClosedKey(){return'session_closed_'+curDayKey()+'_'+todayKey();}
function closeSession(){
  const today=todayKey();
  localStorage.setItem('session_closed_'+day+'_'+today,'1');
  localStorage.setItem('session_closed_'+day+'_alt_'+today,'1');
}
function isSessionClosed(){return localStorage.getItem(sessionClosedKey())==='1';}

function activeKey(){
  const dk=curDayKey(),today=todayKey();
  if(isSessionClosed())return today;
  if(logs[today]&&logs[today][dk]&&hasData(logs[today][dk]))return today;
  if(swRunning){
    const yday=yesterdayKey();
    if(logs[yday]&&logs[yday][dk]&&hasData(logs[yday][dk]))return yday;
  }
  return today;
}
function hasData(dayLog){
  return dayLog&&typeof dayLog==='object'&&Object.keys(dayLog).some(k=>k!=='_meta'&&Array.isArray(dayLog[k])&&dayLog[k].length>0);
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

// ── STORAGE ───────────────────────────────────────────────────────────
function load(){
  loadDays();
  try{logs=JSON.parse(localStorage.getItem(SK_LOGS)||"{}");}catch(e){console.error("Failed to load logs:",e);logs={};}
  try{
    const s=localStorage.getItem(SK_PROG);
    P=s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULT_P));
  }catch(e){console.error("Failed to load program:",e);P=JSON.parse(JSON.stringify(DEFAULT_P));}
  try{
    const s=localStorage.getItem(SK_ALT);
    ALT=s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULT_ALT));
  }catch(e){console.error("Failed to load alt program:",e);ALT=JSON.parse(JSON.stringify(DEFAULT_ALT));}

  DAYS.forEach(dk=>{
    if(!P[dk])P[dk]={label:dk.toUpperCase(),sub:dk.toUpperCase(),color:"#4a9eff",exercises:[]};
    if(!ALT[dk])ALT[dk]={label:dk.toUpperCase(),sub:dk.toUpperCase(),color:"#4a9eff",exercises:[]};
  });

  day=guessDay();
  histDay=DAYS[0];
}

let saveT;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{
      localStorage.setItem(SK_LOGS,JSON.stringify(logs));
      localStorage.setItem(SK_PROG,JSON.stringify(P));
      localStorage.setItem(SK_ALT,JSON.stringify(ALT));
      flash();
    }catch(e){console.error(e);}
  },300);
}
function flash(){const b=document.getElementById("save-badge");b.classList.add("show");setTimeout(()=>b.classList.remove("show"),1500);}

// ── LOG OPS ───────────────────────────────────────────────────────────
function curP(){return variant==="alt"?ALT:P;}
function curDayKey(){return variant==="alt"?day+"_alt":day;}
function dl(){
  const t=activeKey(),dk=curDayKey();
  if(!logs[t])logs[t]={};
  if(!logs[t][dk])logs[t][dk]={};
  return logs[t][dk];
}
function sets(id){return dl()[id]||[];}
function addSet(id){
  const d=dl();
  if(!d[id])d[id]=[];
  d[id].push({reps:"",note:"",done:true});
  const t=activeKey(),dk=curDayKey();
  if(!logs[t]._meta)logs[t]._meta={};
  if(!logs[t]._meta[dk])logs[t]._meta[dk]={start:Date.now(),variant};
  localStorage.removeItem(sessionClosedKey());
  if(!swRunning&&swSavedMs===0)swToggle();
  save();renderToday();
}
function upd(id,i,f,v){
  const s=dl()[id];
  if(s&&s[i]!==undefined){s[i][f]=v;save();updateUI();}
}
function delSet(id,i){
  const d=dl();
  if(d[id]){d[id].splice(i,1);if(!d[id].length)delete d[id];save();renderToday();}
}
function skipEx(id){
  const d=dl();
  if(d[id]&&d[id].length===1&&d[id][0]._skip){
    delete d[id];
  }else{
    d[id]=[{_skip:true,reps:"—",note:"skipped",done:false}];
    const t=activeKey(),dk=curDayKey();
    if(!logs[t])logs[t]={};
    if(!logs[t]._meta)logs[t]._meta={};
    if(!logs[t]._meta[dk])logs[t]._meta[dk]={start:Date.now(),variant};
    localStorage.removeItem(sessionClosedKey());
  }
  save();renderToday();
}

// ── HISTORY DELETE ────────────────────────────────────────────────────
function delSession(date,dk){
  confirm2("Delete Session","Delete the entire logged session for this day?",()=>{
    if(logs[date]){
      delete logs[date][dk];
      delete logs[date][dk+'_alt'];
      if(logs[date]._meta){delete logs[date]._meta[dk];delete logs[date]._meta[dk+'_alt'];}
      const remaining=Object.keys(logs[date]).filter(k=>k!=='_meta');
      if(!remaining.length)delete logs[date];
    }
    save();renderHist();
  });
}
function delHistEx(date,dk,exId){
  confirm2("Remove Exercise","Remove all sets for this exercise from this session?",()=>{
    if(logs[date]&&logs[date][dk])delete logs[date][dk][exId];
    save();renderHist();
  });
}
function delHistSet(date,dk,exId,idx){
  if(logs[date]&&logs[date][dk]&&logs[date][dk][exId]){
    logs[date][dk][exId].splice(idx,1);
    if(!logs[date][dk][exId].length)delete logs[date][dk][exId];
    save();renderHist();
  }
}

// ── PROGRAM EDIT ──────────────────────────────────────────────────────
function addExercise(){
  const ex={id:uid(),name:"New Exercise",target:"3 × 10",phase:"Strength"};
  curP()[day].exercises.push(ex);
  save();expandedEx=ex.id;renderEdit();
  setTimeout(()=>{const el=document.getElementById("ename-"+ex.id);if(el){el.focus();el.select();}},100);
}
function deleteExercise(id){
  confirm2("Delete Exercise","Remove this exercise from the program?",()=>{
    curP()[day].exercises=curP()[day].exercises.filter(e=>e.id!==id);
    if(expandedEx===id)expandedEx=null;
    save();renderEdit();renderToday();
  });
}
function saveExEdit(id){
  const ex=curP()[day].exercises.find(e=>e.id===id);if(!ex)return;
  const n=document.getElementById("ename-"+id);
  const t=document.getElementById("etarget-"+id);
  const phSelect=document.getElementById("ephase-"+id);
  const phNew=document.getElementById("ephase-new-"+id);
  if(n)ex.name=n.value.trim()||ex.name;
  if(t)ex.target=t.value.trim()||ex.target;
  if(phSelect){
    const val=phSelect.value==="__new__"?(phNew?phNew.value.trim():""):phSelect.value;
    if(val)ex.phase=val;
  }
  expandedEx=null;save();renderEdit();renderToday();
}
function toggleEditExpand(id){expandedEx=expandedEx===id?null:id;renderEdit();}

function addDay(){
  prompt2("Add Day","Enter a name for the new day.","e.g. PUSH, LEGS, CARDIO",name=>{
    if(!name)return;
    const id="day_"+uid();
    const label="DAY "+(DAYS.length+1);
    const sub=name.toUpperCase();
    P[id]={label,sub,color:"#4a9eff",exercises:[]};
    ALT[id]={label,sub,color:"#4a9eff",exercises:[]};
    DAYS.push(id);
    saveDays();save();
    day=id;renderTabs();renderToday();renderEdit();
  });
}

function deleteDay(id){
  if(DAYS.length<=1){
    document.getElementById("conf-title").textContent="Can't Delete";
    document.getElementById("conf-msg").textContent="You need at least one day.";
    confirmCb=null;
    document.getElementById("conf-ok").style.display="none";
    document.getElementById("confirm-modal").classList.add("show");
    return;
  }
  confirm2("Delete Day","Delete this day and all its exercises? History will be kept.",()=>{
    DAYS=DAYS.filter(d=>d!==id);
    delete P[id];delete ALT[id];
    saveDays();save();
    day=DAYS[0];
    histDay=DAYS.includes(histDay)?histDay:DAYS[0];
    renderTabs();renderToday();renderEdit();
  });
}

function renderTabs(){
  const tabsEl=document.getElementById("day-tabs");
  tabsEl.innerHTML=DAYS.map(dk=>{
    const label=P[dk]?P[dk].sub:dk;
    const color=P[dk]?P[dk].color:"#4a9eff";
    const on=dk===day;
    const editing=mode==="edit";
    return`<button class="dtab${on?" on":""}" id="tab-${dk}"
      style="border-bottom-color:${on?color:"transparent"};color:${on?color:"var(--muted)"};background:${on?"var(--card)":"transparent"};position:relative;${editing?"cursor:grab;":""}"
      onclick="setDay('${dk}')"
      draggable="${editing}"
      ondragstart="${editing?"tabDragStart(event,'"+dk+"')":" "}"
      ondragend="${editing?"tabDragEnd(event,'"+dk+"')":" "}"
      ondragover="${editing?"tabDragOver(event,'"+dk+"')":" "}"
      ontouchstart="${editing?"tabTouchStart(event,'"+dk+"')":" "}"
      ontouchmove="${editing?"tabTouchMove(event)":" "}"
      ontouchend="${editing?"tabTouchEnd(event,'"+dk+"')":" "}">
      ${esc(label)}
      ${editing?`<span style="position:absolute;top:2px;right:2px;font-size:7px;color:${on?color+"88":"#444"};line-height:1;pointer-events:none">⠿</span>`:""}
    </button>`;
  }).join('');
  const htabsEl=document.getElementById("hist-day-tabs");
  htabsEl.innerHTML=DAYS.map(dk=>{

// ── STOPWATCH ─────────────────────────────────────────────────────────
let swRunning=false,swStartEpoch=0,swSavedMs=0,swRaf=null;
function swGetElapsed(){return swRunning?swSavedMs+(Date.now()-swStartEpoch):swSavedMs;}
function swTick(){
  if(!swRunning)return;
  const ms=swGetElapsed(),tot=Math.floor(ms/1000);
  const m=Math.floor(tot/60),s=tot%60;
  document.getElementById("sw-display").textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  swRaf=requestAnimationFrame(swTick);
}
function swToggle(){
  if(swRunning){
    swSavedMs=swGetElapsed();swRunning=false;cancelAnimationFrame(swRaf);
    document.getElementById("sw-toggle").textContent="START";
    document.getElementById("sw-toggle").className="sw-btn go";
    const t=activeKey(),dk=curDayKey();
    if(!logs[t])logs[t]={};
    if(!logs[t]._meta)logs[t]._meta={};
    if(!logs[t]._meta[dk])logs[t]._meta[dk]={};
    logs[t]._meta[dk].durationMs=swSavedMs;
    closeSession();
    save();
    document.getElementById("sw-reset").style.display="none";
    document.getElementById("sw-newsession").classList.add("show");
    localStorage.setItem("sw_state",JSON.stringify({running:false,savedMs:swSavedMs,date:todayKey()}));
  }else{
    swStartEpoch=Date.now();swRunning=true;
    document.getElementById("sw-toggle").textContent="STOP";
    document.getElementById("sw-toggle").className="sw-btn stop";
    document.getElementById("sw-reset").style.display="";
    document.getElementById("sw-newsession").classList.remove("show");
    localStorage.setItem("sw_state",JSON.stringify({running:true,startEpoch:swStartEpoch,savedMs:swSavedMs}));
    swTick();
  }
}
function swReset(){
  swRunning=false;cancelAnimationFrame(swRaf);swSavedMs=0;swStartEpoch=0;
  document.getElementById("sw-display").textContent="00:00";
  document.getElementById("sw-toggle").textContent="START";
  document.getElementById("sw-toggle").className="sw-btn go";
  document.getElementById("sw-reset").style.display="";
  document.getElementById("sw-newsession").classList.remove("show");
  localStorage.removeItem("sw_state");
}

// ── NEW SESSION ───────────────────────────────────────────────────────
function newSession(){
  if(swRunning){
    swSavedMs=swGetElapsed();
    swRunning=false;
    cancelAnimationFrame(swRaf);
    const t=activeKey(),dk=curDayKey();
    if(!logs[t])logs[t]={};
    if(!logs[t]._meta)logs[t]._meta={};
    if(!logs[t]._meta[dk])logs[t]._meta[dk]={};
    logs[t]._meta[dk].durationMs=swSavedMs;
    closeSession();
  }

  const today=todayKey();
  const mainDk=day;
  const altDk=day+'_alt';
  const hasMain=logs[today]&&hasData(logs[today][mainDk]);
  const hasAlt=logs[today]&&hasData(logs[today][altDk]);

  if(hasMain||hasAlt){
    let n=2,archiveKey;
    do{archiveKey=today+'_s'+n++;}while(logs[archiveKey]);

    logs[archiveKey]={};
    if(hasMain)logs[archiveKey][mainDk]=JSON.parse(JSON.stringify(logs[today][mainDk]));
    if(hasAlt) logs[archiveKey][altDk] =JSON.parse(JSON.stringify(logs[today][altDk]));
    if(logs[today]&&logs[today]._meta){
      logs[archiveKey]._meta={};
      if(logs[today]._meta[mainDk])logs[archiveKey]._meta[mainDk]=JSON.parse(JSON.stringify(logs[today]._meta[mainDk]));
      if(logs[today]._meta[altDk]) logs[archiveKey]._meta[altDk] =JSON.parse(JSON.stringify(logs[today]._meta[altDk]));
    }
  }

  localStorage.removeItem('session_closed_'+mainDk+'_'+today);
  localStorage.removeItem('session_closed_'+altDk+'_'+today);
  if(logs[today]){
    delete logs[today][mainDk];
    delete logs[today][altDk];
    if(logs[today]._meta){
      delete logs[today]._meta[mainDk];
      delete logs[today]._meta[altDk];
    }
    const remaining=Object.keys(logs[today]).filter(k=>k!=='_meta');
    if(!remaining.length)delete logs[today];
  }

  swSavedMs=0;swStartEpoch=0;
  localStorage.removeItem("sw_state");
  document.getElementById("sw-display").textContent="00:00";
  document.getElementById("sw-toggle").textContent="START";
  document.getElementById("sw-toggle").className="sw-btn go";
  document.getElementById("sw-reset").style.display="";
  document.getElementById("sw-newsession").classList.remove("show");

  save();
  renderToday();
}

function swRestore(){
  try{
    const s=JSON.parse(localStorage.getItem("sw_state")||"null");if(!s)return;
    if(s.running){
      swSavedMs=s.savedMs||0;swStartEpoch=s.startEpoch||Date.now();swRunning=true;
      document.getElementById("sw-toggle").textContent="STOP";
      document.getElementById("sw-toggle").className="sw-btn stop";
      document.getElementById("sw-reset").style.display="";
      document.getElementById("sw-newsession").classList.remove("show");
      swTick();
    }else{
      swSavedMs=s.savedMs||0;
      const tot=Math.floor(swSavedMs/1000),m=Math.floor(tot/60),sc=tot%60;
      document.getElementById("sw-display").textContent=`${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`;
      if(swSavedMs>0&&s.date===todayKey()){
        document.getElementById("sw-reset").style.display="none";
        document.getElementById("sw-newsession").classList.add("show");
      }
    }
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&swRunning){cancelAnimationFrame(swRaf);swTick();}});

// ── REST TIMER ────────────────────────────────────────────────────────
let breakTotal=90,breakEndEpoch=0,breakRunning=false,breakRaf=null,breakPausedRemaining=90;
let wakeLock=null;
async function requestWakeLock(){
  try{
    if("wakeLock" in navigator){
      wakeLock=await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release",()=>{wakeLock=null;});
    }
  }catch(e){console.warn("WakeLock:",e);}
}
function releaseWakeLock(){if(wakeLock){wakeLock.release();wakeLock=null;}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&breakRunning&&!wakeLock)requestWakeLock();});
function breakGetRemaining(){return breakRunning?Math.max(0,Math.ceil((breakEndEpoch-Date.now())/1000)):breakPausedRemaining;}
function openBreak(){document.getElementById("break-modal").classList.add("show");updateBreakDisplay();}
function closeBreak(){document.getElementById("break-modal").classList.remove("show");}
function setBreakPreset(secs){
  if(breakRunning)return;
  breakTotal=secs;breakPausedRemaining=secs;
  document.querySelectorAll(".bpreset").forEach(b=>b.classList.remove("on"));
  const presets=[60,90,120,180];
  const idx=presets.indexOf(secs);
  if(idx!==-1)document.querySelectorAll(".bpreset")[idx].classList.add("on");
  document.getElementById("bcustom-min").value=Math.floor(secs/60);
  document.getElementById("bcustom-sec").value=secs%60;
  updateBreakDisplay();
}
function applyCustomBreak(){
  if(breakRunning)return;
  const m=parseInt(document.getElementById("bcustom-min").value)||0;
  const s=parseInt(document.getElementById("bcustom-sec").value)||0;
  const total=m*60+s;if(total<=0)return;
  breakTotal=total;breakPausedRemaining=total;
  document.querySelectorAll(".bpreset").forEach(b=>b.classList.remove("on"));
  updateBreakDisplay();
}
function playBeep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,300,600].forEach(delay=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=880;osc.type="sine";
      gain.gain.setValueAtTime(0.8,ctx.currentTime+delay/1000);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+delay/1000+0.4);
      osc.start(ctx.currentTime+delay/1000);
      osc.stop(ctx.currentTime+delay/1000+0.4);
    });
  }catch(e){console.warn("Audio:",e);}
}
async function requestNotifPermission(){
  if(!('Notification' in window))return false;
  if(Notification.permission==='granted')return true;
  if(Notification.permission==='denied')return false;
  return(await Notification.requestPermission())==='granted';
}
function swMsg(data){
  if('serviceWorker'in navigator&&navigator.serviceWorker.controller)
    navigator.serviceWorker.controller.postMessage(data);
}
function scheduleRestNotif(endEpoch){swMsg({type:'scheduleRest',endEpoch});}
function cancelRestNotif(){swMsg({type:'cancelRest'});}
function breakTick(){
  if(!breakRunning)return;
  const rem=breakGetRemaining();
  updateBreakDisplay();
  if(rem<=0){
    breakRunning=false;cancelAnimationFrame(breakRaf);breakPausedRemaining=0;
    cancelRestNotif();releaseWakeLock();
    document.getElementById("bctrl-start").textContent="RESET";
    document.getElementById("bctrl-start").className="bctrl done";
    document.getElementById("break-fab").classList.remove("running");
    document.getElementById("break-fab").classList.add("done");
    playBeep();
    if(navigator.vibrate)navigator.vibrate([200,100,200,100,400]);
    localStorage.removeItem("break_state");
    return;
  }
  breakRaf=requestAnimationFrame(breakTick);
}
function breakToggle(){
  const rem=breakGetRemaining();
  if(rem<=0){
    breakPausedRemaining=breakTotal;breakRunning=false;cancelAnimationFrame(breakRaf);
    cancelRestNotif();releaseWakeLock();
    document.getElementById("bctrl-start").textContent="START";
    document.getElementById("bctrl-start").className="bctrl";
    document.getElementById("break-fab").classList.remove("running","done");
    updateBreakDisplay();localStorage.removeItem("break_state");
    return;
  }
  if(breakRunning){
    breakPausedRemaining=breakGetRemaining();breakRunning=false;cancelAnimationFrame(breakRaf);
    cancelRestNotif();releaseWakeLock();
    document.getElementById("bctrl-start").textContent="RESUME";
    document.getElementById("bctrl-start").className="bctrl";
    document.getElementById("break-fab").classList.remove("running");
    localStorage.setItem("break_state",JSON.stringify({running:false,total:breakTotal,remaining:breakPausedRemaining}));
  }else{
    breakEndEpoch=Date.now()+breakPausedRemaining*1000;breakRunning=true;
    document.getElementById("bctrl-start").textContent="PAUSE";
    document.getElementById("bctrl-start").className="bctrl running";
    document.getElementById("break-fab").classList.add("running");
    document.getElementById("break-fab").classList.remove("done");
    localStorage.setItem("break_state",JSON.stringify({running:true,total:breakTotal,endEpoch:breakEndEpoch}));
    requestWakeLock();
    requestNotifPermission().then(ok=>{if(ok)scheduleRestNotif(breakEndEpoch);});
    breakTick();
  }
}
function updateBreakDisplay(){
  const rem=breakGetRemaining(),m=Math.floor(rem/60),s=rem%60;
  const txt=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const done=rem<=0,urgent=rem<=10&&!done;
  document.getElementById("break-time-display").textContent=done?"DONE":txt;
  document.getElementById("break-time-display").className=done?"done":urgent?"urgent":"";
  document.getElementById("bprog-fill").style.width=(breakTotal>0?(rem/breakTotal)*100:100)+"%";
  document.getElementById("bprog-fill").className=urgent?"urgent":"";
  document.getElementById("bfab-time").textContent=done?"DONE":txt;
  document.getElementById("bfab-lbl").textContent=done?"✓":"REST";
  const fab=document.getElementById("break-fab");
  if(done)fab.classList.add("done");else fab.classList.remove("done");
}
function breakRestore(){
  try{
    const s=JSON.parse(localStorage.getItem("break_state")||"null");if(!s)return;
    breakTotal=s.total||90;
    if(s.running){
      breakEndEpoch=s.endEpoch;const rem=breakGetRemaining();
      if(rem>0){
        breakPausedRemaining=rem;breakRunning=true;
        document.getElementById("bctrl-start").textContent="PAUSE";
        document.getElementById("bctrl-start").className="bctrl running";
        document.getElementById("break-fab").classList.add("running");
        requestWakeLock();
        requestNotifPermission().then(ok=>{if(ok)scheduleRestNotif(breakEndEpoch);});
        breakTick();
      }else{
        breakPausedRemaining=0;
        document.getElementById("bctrl-start").textContent="RESET";
        document.getElementById("bctrl-start").className="bctrl done";
        document.getElementById("break-fab").classList.add("done");
        if(navigator.vibrate)navigator.vibrate([200,100,200,100,400]);
      }
    }else{
      breakPausedRemaining=s.remaining||s.total||90;
    }
    updateBreakDisplay();
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&breakRunning){cancelAnimationFrame(breakRaf);breakTick();}});

// ── LAST SESSION DATA ─────────────────────────────────────────────────
function getLastSession(exId){
  const dk=curDayKey(),activeDate=activeKey();
  const dates=Object.keys(logs)
    .filter(dt=>dt!==activeDate&&logs[dt][dk]&&Array.isArray(logs[dt][dk][exId])&&logs[dt][dk][exId].length>0)
    .sort((a,b)=>b.localeCompare(a));
  if(!dates.length)return null;
  return logs[dates[0]][dk][exId];
}
function fmtLastSession(sets){
  if(!sets||!sets.length)return null;
  const logged=sets.filter(s=>!s._skip&&(s.reps||s.note));
  if(!logged.length)return null;
  return logged.map(s=>[s.reps,s.note].filter(Boolean).join(' ')).filter(Boolean).join(' · ');
}

// ── PROGRESS ─────────────────────────────────────────────────────────
function hasRealSets(id){
  const ss=sets(id);
  if(!ss.length)return false;
  if(ss.length===1&&ss[0]._skip)return true;
  return ss.some(s=>s.reps||s.note);
}
function prog(){
  const exs=curP()[day]?curP()[day].exercises:[];
  const logged=exs.filter(e=>hasRealSets(e.id)).length;
  const pct=exs.length?Math.round(logged/exs.length*100):0;
  return{logged,total:exs.length,pct};
}
function updateUI(){
  const{logged,total,pct}=prog(),c=P[day].color;
  document.getElementById("prog-ct").textContent=`${logged}/${total}`;
  document.getElementById("prog-ct").style.color=c;
  document.getElementById("prog-fill").style.width=pct+"%";
  document.getElementById("prog-fill").style.background=c;
  document.getElementById("f-dot").style.background=pct===100?"var(--green)":c;
  document.getElementById("f-lbl").textContent=P[day].sub;
  document.getElementById("f-pct").textContent=pct+"%";
  document.getElementById("f-pct").style.color=c;
  document.getElementById("f-frac").textContent=`${logged}/${total}`;
  document.getElementById("done-banner").classList.toggle("show",pct===100&&total>0);
  (curP()[day]||{exercises:[]}).exercises.forEach(ex=>{
    const card=document.getElementById("c-"+ex.id);if(!card)return;
    const ss=sets(ex.id);
    const isSkipped=ss.length===1&&ss[0]._skip;
    const allDone=hasRealSets(ex.id)&&!isSkipped;
    card.classList.toggle("done-all",allDone);
    card.classList.toggle("skipped",isSkipped);
    if(!allDone&&!isSkipped)card.style.borderLeftColor=c;
    else if(isSkipped)card.style.borderLeftColor="var(--muted)";
  });
}

const ICO_TRASH=`<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M1.5 3h9M4.5 3V2.5a.5.5 0 01.5-.5h2a.5.5 0 01.5.5V3M3 3l.75 7.5h4.5L9 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

          })()}</div>
        </div>
        ${isSkipped
          ? `<button class="skip-btn active" onclick="skipEx('${ex.id}')">↩ UNDO</button>`
          : `<button class="addset-btn" style="border-color:${c}44;color:${c}" onclick="addSet('${ex.id}')">${ICO_PLUS} SET</button>

        }
      </div>`;
    if(isSkipped){

    }else if(ss.length>0){
      html+=`<div class="sets-wrap"><div class="sets-hdr"><div class="sh">REPS / TIME</div><div class="sh">NOTE</div><div></div></div>`;
      ss.forEach((s,i)=>{
        html+=`<div class="set-row">
          <input type="text" inputmode="decimal" placeholder="reps / secs" value="${esc(s.reps)}" oninput="upd('${ex.id}',${i},'reps',this.value)">
          <input type="text" placeholder="note" value="${esc(s.note)}" oninput="upd('${ex.id}',${i},'note',this.value)">
          <button class="del-btn" onclick="delSet('${ex.id}',${i})">${ICO_TRASH}</button>
        </div>`;
      });
      html+=`</div>`;
    }else{
      html+=`<div class="empty-hint">Tap + SET to log</div>`;
    }
    html+=`</div>`;
  });
  document.getElementById("main").innerHTML=html;
  updateUI();
}

// ── RENDER EDIT ───────────────────────────────────────────────────────
function renderEdit(){
  const d=curP()[day];if(!d)return;
  document.getElementById("edit-day-header").innerHTML=`
    <div class="edit-day-hdr">
      <div class="edit-day-lbl">${esc(d.label)}</div>
      <input value="${esc(d.sub)}" placeholder="Day label" style="font-size:14px;font-weight:700;"
        onchange="curP()['${day}'].sub=this.value.trim()||curP()['${day}'].sub;save();renderTabs();renderToday();">
    </div>`;
  let html="";
  d.exercises.forEach(ex=>{
    const open=expandedEx===ex.id;
    const phases=[...new Set(curP()[day].exercises.map(e=>e.phase))];
    const phOpts=phases.map(p=>`<option value="${esc(p)}"${p===ex.phase?" selected":""}>${esc(p)}</option>`).join("");
    html+=`<div class="edit-excard" id="ec-${ex.id}" data-id="${ex.id}"
      draggable="true" ondragstart="onDragStart(event,'${ex.id}')" ondragend="onDragEnd()" ondragover="onDragOver(event,'${ex.id}')">
      <div class="edit-excard-hdr">
        <span class="drag-handle" ontouchstart="onTouchStart(event,'${ex.id}')" ontouchmove="onTouchMove(event)" ontouchend="onTouchEnd()">≡</span>
        <div style="flex:1;min-width:0">
          <div class="edit-exname">${esc(ex.name)}</div>
          <div class="edit-extarget">${esc(ex.target)} · <span style="color:var(--muted)">${esc(ex.phase)}</span></div>
        </div>
        <button class="edit-expand-btn" onclick="toggleEditExpand('${ex.id}')">${open?"▲ Close":"▼ Edit"}</button>
      </div>
      <div class="edit-exbody${open?" open":""}">
        <div class="edit-field"><label>NAME</label><input id="ename-${ex.id}" value="${esc(ex.name)}"></div>
        <div class="edit-field"><label>TARGET</label><input id="etarget-${ex.id}" value="${esc(ex.target)}"></div>
        <div class="edit-field"><label>PHASE / SECTION</label>
          <select id="ephase-${ex.id}" onchange="onPhaseChange('${ex.id}')"
            style="background:#0a0a0a;border:1px solid #252525;color:var(--text);padding:8px 9px;font-size:15px;width:100%;outline:none;border-radius:2px;font-family:inherit;-webkit-appearance:none;">
            ${phOpts}
            <option value="__new__">+ New section...</option>
          </select>
          <input id="ephase-new-${ex.id}" placeholder="Type new section name"
            style="display:none;margin-top:6px;background:#0a0a0a;border:1px solid #252525;color:var(--text);padding:8px 9px;font-size:15px;width:100%;outline:none;border-radius:2px;font-family:inherit;">
        </div>
        <div class="edit-actions">
          <button class="eact-btn eact-del" onclick="deleteExercise('${ex.id}')">${ICO_TRASH} Delete</button>
          <button class="eact-btn eact-save" onclick="saveExEdit('${ex.id}')">✓ Save</button>
        </div>
      </div>
    </div>`;
  });
  document.getElementById("edit-list").innerHTML=html;
}

// ── RENDER HISTORY ────────────────────────────────────────────────────
function renderHist(){
  const c=P[histDay]?P[histDay].color:"#4a9eff";
  DAYS.forEach(dk=>{
    const b=document.getElementById("htab-"+dk);if(!b)return;
    const on=dk===histDay,col=P[dk]?P[dk].color:"#4a9eff";
    b.className="hdt"+(on?" on":"");
    b.style.color=on?col:"";
    b.style.borderColor=on?col+"55":"";
  });

  const hist=Object.entries(logs)
    .filter(([dt,data])=>{
      const m=data[histDay],a=data[histDay+"_alt"];
      return hasData(m)||hasData(a);
    })
    .map(([dt,data])=>{
      const baseDate=dt.replace(/_s\d+$/,'');
      return[dt,data,baseDate];
    })
    .sort(([a],[b])=>b.localeCompare(a))
    .slice(0,30);

  const el=document.getElementById("hist-content");
  if(!hist.length){el.innerHTML=`<div class="no-hist">No sessions logged yet.</div>`;return;}

  let html="";
  hist.forEach(([dt,data,baseDate])=>{
    const renderVariant=(vk,vlabel)=>{
      const sd=data[vk]||{};
      const allIds=Object.keys(sd).filter(id=>id!=='_meta'&&Array.isArray(sd[id])&&sd[id].length>0);
      if(!allIds.length)return"";
      const exSrc=vk.endsWith("_alt")?ALT:P;
      const meta=(data._meta&&data._meta[vk])||{};
      let durStr="";
      if(meta.durationMs){
        const tot=Math.floor(meta.durationMs/1000);
        const h=Math.floor(tot/3600),m=Math.floor((tot%3600)/60),s=tot%60;
        durStr=h>0?h+"h "+m+"m":m>0?m+"m "+String(s).padStart(2,"0")+"s":s>0?s+"s":"";
      }
      let h=`<div style="font-size:8.1px;letter-spacing:2px;color:${vlabel==="ALT"?"#b69ef5":c};padding:6px 14px 4px;font-weight:700;">${vlabel}${durStr?" · "+durStr:""}</div>`;
      allIds.forEach(id=>{
        const dayExs=(exSrc[histDay]||{exercises:[]}).exercises;
        const f=dayExs.find(e=>e.id===id);
        const name=f?f.name:id;
        const ss=sd[id]||[];
        h+=`<div class="hex"><div class="hexname"><span>${esc(name)}</span><button class="hdel-ex" onclick="delHistEx('${dt}','${vk}','${id}')">✕ remove</button></div><div class="hsets">`;
        ss.forEach((s,si)=>{
          const pts=[s.reps||"—",s.note].filter(Boolean).join(" · ");
          h+=`<div class="hpill${s.done?" dk":""}">${s.done?"✓ ":""}${esc(pts)}<button class="hdel-set" onclick="delHistSet('${dt}','${vk}','${id}',${si})">✕</button></div>`;
        });
        h+=`</div></div>`;
      });
      return h;
    };
    const mainContent=renderVariant(histDay,"MAIN");
    const altContent=renderVariant(histDay+"_alt","ALT");
    if(!mainContent&&!altContent)return;

    const sessionNum=dt.match(/_s(\d+)$/);
    const d=new Date((baseDate||dt)+"T12:00:00");
    const lbl=d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})
      +(sessionNum?`  ·  Session ${sessionNum[1]}`:'');

    html+=`<div class="hsession" style="border-left-color:${c}">
      <div class="hshdr">
        <div class="hsdate" style="color:${c}">${lbl}</div>
        <button class="hdel-session" onclick="delSession('${dt}','${histDay}')">${ICO_TRASH}</button>
      </div>
      ${mainContent}${altContent}
    </div>`;
  });
  el.innerHTML=html||`<div class="no-hist">No sessions logged yet.</div>`;
}

// ── VIEW SWITCHING ────────────────────────────────────────────────────
function setMode(m){
  mode=m;
  document.getElementById("today-view").style.display=m==="today"?"block":"none";
  document.getElementById("hist-view").classList.toggle("show",m==="history");
  document.getElementById("edit-view").classList.toggle("show",m==="edit");
  document.querySelectorAll(".mode-btn").forEach((b,i)=>{
    const isOn=(i===0&&m==="today")||(i===1&&m==="history")||(i===2&&m==="edit");
    b.className="mode-btn"+(isOn?(m==="edit"?" edit-on":" on"):"");
  });
  const showToday=m==="today";
  document.getElementById("float").style.display=showToday?"flex":"none";
  document.getElementById("break-fab").style.display=showToday?"flex":"none";
  document.getElementById("stopwatch-wrap").style.display=showToday?"flex":"none";
  if(m==="history")renderHist();
  if(m==="edit"){expandedEx=null;renderEdit();}
  renderTabs();
}
function setDay(d){
  day=d;expandedEx=null;variant="main";
  localStorage.setItem("last_day",d);
  document.getElementById("vtab-main").className="vtab on";
  document.getElementById("vtab-alt").className="vtab";
  renderToday();
  if(mode==="edit")renderEdit();
}
function setVariant(v){
  variant=v;
  document.getElementById("vtab-main").className="vtab"+(v==="main"?" on":"");
  document.getElementById("vtab-alt").className="vtab"+(v==="alt"?" alt-on":"");
  renderToday();
  if(mode==="edit")renderEdit();
}
function setHistDay(d){histDay=d;renderHist();}

// ── CONFIRM ───────────────────────────────────────────────────────────
function confirm2(title,msg,cb){
  document.getElementById("conf-title").textContent=title;
  document.getElementById("conf-msg").textContent=msg;
  document.getElementById("conf-ok").style.display="";
  confirmCb=cb;
  document.getElementById("confirm-modal").classList.add("show");
}
function doConfirm(){closeConfirm();if(confirmCb)confirmCb();confirmCb=null;}
function closeConfirm(){document.getElementById("confirm-modal").classList.remove("show");}
document.getElementById("confirm-modal").addEventListener("click",e=>{if(e.target===document.getElementById("confirm-modal"))closeConfirm();});

let inputCb=null;
function prompt2(title,msg,placeholder,cb){
  document.getElementById("input-title").textContent=title;
  document.getElementById("input-msg").textContent=msg;
  const f=document.getElementById("input-value");
  f.placeholder=placeholder||"";f.value="";
  inputCb=cb;
  document.getElementById("input-modal").classList.add("show");
  setTimeout(()=>f.focus(),50);
}
function doInputModal(){
  const val=document.getElementById("input-value").value.trim();
  closeInputModal();
  if(inputCb)inputCb(val);
  inputCb=null;
}
function closeInputModal(){document.getElementById("input-modal").classList.remove("show");}
document.getElementById("input-modal").addEventListener("click",e=>{if(e.target===document.getElementById("input-modal"))closeInputModal();});
document.getElementById("input-value").addEventListener("keydown",e=>{if(e.key==="Enter")doInputModal();});

document.getElementById("break-modal").addEventListener("click",e=>{if(e.target===document.getElementById("break-modal"))closeBreak();});
window.addEventListener("online",()=>document.getElementById("offline-bar").classList.remove("show"));
window.addEventListener("offline",()=>document.getElementById("offline-bar").classList.add("show"));
if("serviceWorker"in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW:",e)));
}


// ── EXPORT / IMPORT ──────────────────────────────────────────────────
function exportHistory(){
  const data=localStorage.getItem(SK_LOGS)||"{}";
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="workout_history_"+todayKey()+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importHistory(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const incoming=JSON.parse(ev.target.result);
      const existing=JSON.parse(localStorage.getItem(SK_LOGS)||"{}");
      const merged=Object.assign({},incoming,existing);
      localStorage.setItem(SK_LOGS,JSON.stringify(merged));
      logs=merged;
      flash();
      renderHist();
    }catch(err){
      alert("Import failed — invalid JSON file.");
    }
    e.target.value="";
  };
  reader.readAsText(file);
}
